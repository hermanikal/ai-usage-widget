name: AIUsageMac
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
targets:
  AIUsageMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AIUsageMac
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/AIUsageMac.entitlements
    dependencies:
      - target: AIUsageWidget
        embed: true
        codeSign: true
  AIUsageWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Shared
      - path: Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AIUsageMac.Widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/AIUsageWidget.entitlements
